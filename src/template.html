:root{
  --frame:#2659A5; --blue:#2659A5; 
  --ground:#F5F0E8; --surface:#FFFFFF; --panel:#FAF7F1; --raise:#EDE7DB;
  --ink:#22262C; --ink-2:#4A4F57; --muted:#6E6A61; --line:#E4DCCD; --line-2:#CFC5B2;
  --head:#2659A5; --accent:#2659A5; --accent-soft:#E4EBF7;
  --lime:#D7D900; --lime-ink:#6E6F00; --lime-bg:#F4F5C4; --lime-line:#E2E48A;
  --win:#14785A; --win-bg:#E3F0EA; --win-line:#B4D8C9;
  --loss:#C93216; --loss-bg:#FCE7E1; --loss-line:#F2C5B8;
  --flat:#6F6A60; --flat-bg:#EFEBE2; --flat-line:#DCD5C7;
  --run:#6E6F00; --run-bg:#F4F5C4; --run-line:#E2E48A;
  --shadow:0 1px 2px rgba(34,38,44,.04),0 10px 28px -20px rgba(38,89,165,.35);
  --sans:Poppins,"Avenir Next",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
  --r:16px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --frame:#16325C; --blue:#8FB2EC; --ground:#121924; --surface:#1B2431; --panel:#161E29; --raise:#233040;
    --ink:#ECE7DD; --ink-2:#C6CBD3; --muted:#98A0AC; --line:#2A3441; --line-2:#3C4857;
    --head:#8FB2EC; --accent:#8FB2EC; --accent-soft:#1C2A41;
    --lime:#D7D900; --lime-ink:#D7D900; --lime-bg:#2C2E0C; --lime-line:#575A15;
    --win:#3DBF92; --win-bg:#102C24; --win-line:#215747;
    --loss:#FF7452; --loss-bg:#2F1710; --loss-line:#63301F;
    --flat:#9AA1A9; --flat-bg:#1F2833; --flat-line:#333E4B;
    --run:#D7D900; --run-bg:#2C2E0C; --run-line:#575A15;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -20px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --frame:#16325C; --blue:#8FB2EC; --ground:#121924; --surface:#1B2431; --panel:#161E29; --raise:#233040;
  --ink:#ECE7DD; --ink-2:#C6CBD3; --muted:#98A0AC; --line:#2A3441; --line-2:#3C4857;
  --head:#8FB2EC; --accent:#8FB2EC; --accent-soft:#1C2A41;
  --lime:#D7D900; --lime-ink:#D7D900; --lime-bg:#2C2E0C; --lime-line:#575A15;
  --win:#3DBF92; --win-bg:#102C24; --win-line:#215747;
  --loss:#FF7452; --loss-bg:#2F1710; --loss-line:#63301F;
  --flat:#9AA1A9; --flat-bg:#1F2833; --flat-line:#333E4B;
  --run:#D7D900; --run-bg:#2C2E0C; --run-line:#575A15;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -20px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html{background:var(--frame)}
body{margin:0;padding:9px;background:var(--frame);color:var(--ink);
  font-family:var(--sans);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
.frame{background:var(--ground);border-radius:22px;min-height:calc(100vh - 18px)}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.02em;text-wrap:balance;color:var(--head)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.9em;letter-spacing:-.02em}

/* ---------- header ---------- */
.top{position:sticky;top:9px;z-index:40;display:flex;align-items:center;gap:22px;
  padding:0 22px;height:62px;background:var(--ground);border-radius:21px 21px 0 0;
  border-bottom:1px solid var(--line)}
.dots{display:flex;gap:5px;flex:none}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--lime)}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap}
.brand b{font-size:20px;font-weight:700;letter-spacing:-.045em;color:var(--head)}
.brand span{background:var(--lime);color:#1B3F76;font-size:9.5px;font-weight:700;
  letter-spacing:.14em;padding:5px 10px;border-radius:999px}
.tabs{display:flex;gap:4px;margin-right:auto}
.tabs button{background:none;border:0;padding:8px 15px;border-radius:999px;color:var(--muted);
  cursor:pointer;font-size:13.5px;font-weight:500}
.tabs button:hover{color:var(--head);background:var(--raise)}
.tabs button[aria-selected="true"]{background:var(--blue);color:var(--surface);font-weight:600}
:root[data-theme="dark"] .tabs button[aria-selected="true"],
:root:not([data-theme="light"]) .tabs button[aria-selected="true"]{color:#0F1722}
.stamp{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;white-space:nowrap}
.stamp i{width:7px;height:7px;border-radius:50%;background:var(--lime)}
.themebtn{background:none;border:1px solid var(--line-2);border-radius:999px;width:32px;height:32px;
  cursor:pointer;color:var(--muted);line-height:1;flex:none}
.themebtn:hover{color:var(--head);border-color:var(--blue)}

main{max-width:1580px;margin:0 auto;padding:26px 22px 80px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;
  margin-bottom:18px}
.eyebrow{display:inline-block;background:var(--lime);color:#1B3F76;font-size:10px;font-weight:700;
  letter-spacing:.15em;padding:5px 12px;border-radius:999px;margin-bottom:11px}
.pagehead h1{font-size:33px;line-height:1.12}
.pagehead h1 em{font-style:normal;color:var(--loss)}
.pagehead .sub{margin:9px 0 0;color:var(--muted);font-size:13px}
.pagehead .sub b{color:var(--ink-2);font-weight:600}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);font-weight:500}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:50%}
.lg-w{background:var(--win)}.lg-c{background:var(--loss)}.lg-i{background:var(--flat)}.lg-r{background:var(--lime)}

/* ---------- controls ---------- */
.controls{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:16px 0 14px}
.field{position:relative;display:flex;align-items:center}
.field select{appearance:none;background:var(--surface);border:1px solid var(--line);border-radius:999px;
  padding:9px 34px 9px 16px;font-size:13px;font-weight:500;cursor:pointer;min-width:136px}
.field select:hover{border-color:var(--blue)}
.field::after{content:"";position:absolute;right:14px;pointer-events:none;
  border:4px solid transparent;border-top-color:var(--muted);margin-top:3px}
.field select optgroup{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted)}
.field select option{font-size:13px;font-weight:400;text-transform:none;letter-spacing:0;color:var(--ink)}
.seg{display:flex;background:var(--raise);border-radius:999px;padding:3px}
.seg button{background:none;border:0;padding:6px 14px;border-radius:999px;font-size:12.5px;
  font-weight:500;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--head);font-weight:600;
  box-shadow:var(--shadow)}
.search{flex:1;min-width:190px;max-width:320px;margin-left:auto}
.search input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:999px;
  padding:9px 16px;font-size:13px}
.search input::placeholder{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--blue);color:var(--surface);
  border-radius:999px;padding:6px 8px 6px 14px;font-size:12px;font-weight:600}
:root[data-theme="dark"] .chip,:root:not([data-theme="light"]) .chip{color:#0F1722}
.chip button{background:none;border:0;cursor:pointer;color:inherit;font-size:15px;line-height:1;
  padding:0 4px;opacity:.75}
.chip button:hover{opacity:1}

/* ---------- matriz ---------- */
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);box-shadow:var(--shadow)}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:1040px}
thead th{position:sticky;top:71px;z-index:12;background:var(--panel);
  border-bottom:1px solid var(--line);padding:14px;text-align:center;
  font-size:14px;font-weight:700;color:var(--head);white-space:nowrap;letter-spacing:-.01em}
thead th:first-child{left:0;z-index:14;text-align:left;text-transform:uppercase;
  font-size:10px;letter-spacing:.14em;color:var(--muted);border-right:1px solid var(--line)}
tbody th{position:sticky;left:0;z-index:8;background:var(--surface);text-align:left;
  padding:13px 16px 13px 14px;border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);font-weight:400;min-width:276px;max-width:304px}
tbody td{padding:7px;border-bottom:1px solid var(--line);vertical-align:middle;min-width:148px}
tbody tr:last-child th,tbody tr:last-child td{border-bottom:0}
tbody tr:hover th,tbody tr:hover td{background:var(--panel)}
.famname{display:block;background:none;border:0;padding:0;text-align:left;cursor:pointer;
  font-size:15px;font-weight:600;letter-spacing:-.015em;line-height:1.3;color:var(--ink)}
.famname:hover{color:var(--blue)}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px;align-items:center}
.tag{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;font-weight:700;
  padding:3px 8px;border-radius:999px;background:var(--raise);color:var(--muted)}
.tag.area{background:var(--accent-soft);color:var(--blue)}
.tag.n{background:none;border:1px solid var(--line-2);color:var(--muted);letter-spacing:.05em}
.tag.kind{background:var(--lime-bg);color:var(--lime-ink);border:1px solid var(--lime-line)}
.obar{display:flex;height:4px;border-radius:999px;overflow:hidden;margin-top:10px;
  background:var(--raise);width:152px}
.obar i{height:100%}
.obar .w{background:var(--win)}.obar .c{background:var(--loss)}
.obar .i{background:var(--flat)}.obar .r{background:var(--lime)}

.cell{display:block;width:100%;text-align:left;cursor:pointer;border-radius:11px;
  padding:9px 11px;border:1px solid transparent;background:none;position:relative}
.cell:hover{border-color:var(--blue)}
.cell .lab{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;white-space:nowrap}
.cell .lab i{width:7px;height:7px;border-radius:50%;flex:none}
.cell .rpv{margin-top:3px;font-size:12.5px;font-weight:500}
.cell .plus{margin-left:auto;font-size:10px;font-weight:700;opacity:.7;font-family:var(--mono)}
.tip{position:fixed;z-index:999;max-width:320px;padding:8px 10px;border-radius:10px;
  background:var(--raise);color:var(--ink);border:1px solid var(--line-2);
  font:12px/1.5 var(--sans);box-shadow:var(--shadow);pointer-events:none}
.c-winner{background:var(--win-bg);border-color:var(--win-line)}
.c-winner .lab{color:var(--win)}.c-winner .lab i{background:var(--win)}
.c-control{background:var(--loss-bg);border-color:var(--loss-line)}
.c-control .lab{color:var(--loss)}.c-control .lab i{background:var(--loss)}
.c-inconclusive{background:var(--flat-bg);border-color:var(--flat-line)}
.c-inconclusive .lab{color:var(--flat)}.c-inconclusive .lab i{background:var(--flat)}
.c-running,.c-paused{background:var(--run-bg);border-color:var(--run-line)}
.c-running .lab,.c-paused .lab{color:var(--run)}
.c-running .lab i,.c-paused .lab i{background:var(--lime)}
.pos{color:var(--win)}.neg{color:var(--loss)}.zero{color:var(--muted)}
.empty{text-align:center;color:var(--line-2);font-size:16px;user-select:none}

/* ---------- kpis ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;
  box-shadow:var(--shadow)}
.kpi h4{margin:0;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);font-weight:700}
.kpi .v{font-size:26px;font-weight:700;margin-top:8px;letter-spacing:-.035em;color:var(--head)}
.kpi .v.pos{color:var(--win)}.kpi .v.neg{color:var(--loss)}
/* valor quebrado por moeda: cabe mais texto, então reduz e deixa quebrar linha */
.kpi .v.moedas{font-size:15px;line-height:1.35;letter-spacing:-.01em;word-spacing:.05em}
.kpi .n{color:var(--muted);font-size:11px;margin-top:2px}

/* ---------- cards de teste ---------- */
.cards{display:flex;flex-direction:column;gap:11px}
.card{background:var(--surface);border:1px solid var(--line);border-left-width:4px;
  border-radius:var(--r);padding:17px 19px;box-shadow:var(--shadow)}
.card.k-winner{border-left-color:var(--win)}
.card.k-control{border-left-color:var(--loss)}
.card.k-inconclusive{border-left-color:var(--flat)}
.card.k-running,.card.k-paused{border-left-color:var(--lime)}
.card-h{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;flex-wrap:wrap}
.card-h h3{font-size:18px;line-height:1.3;color:var(--ink)}
.card-meta{color:var(--muted);font-size:12px;margin-top:6px;display:flex;gap:8px;flex-wrap:wrap;
  align-items:center}
.card-meta b{color:var(--head);font-weight:600}
.card-meta em{font-style:normal;opacity:.45}
.pills{display:flex;gap:7px;flex-wrap:wrap;flex:none}
.pill{font-size:11px;font-weight:600;padding:5px 12px;border-radius:999px;border:1px solid var(--line);
  color:var(--muted);white-space:nowrap}
.pill.k-winner{background:var(--win-bg);border-color:var(--win-line);color:var(--win)}
.pill.k-control{background:var(--loss-bg);border-color:var(--loss-line);color:var(--loss)}
.pill.k-inconclusive{background:var(--flat-bg);border-color:var(--flat-line);color:var(--flat)}
.pill.k-running,.pill.k-paused{background:var(--lime);border-color:var(--lime);color:#1B3F76}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:15px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.tile h5{margin:0;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  font-weight:700}
.tile .ab{margin-top:7px;font-size:12.5px;color:var(--ink-2)}
.tile .ab em{font-style:normal;color:var(--muted);padding:0 4px}
.tile .lift{margin-top:3px;font-size:15px;font-weight:700;letter-spacing:-.03em}
.tile.sig .big{margin-top:7px;font-size:13.5px;font-weight:600}

/* ---------- roadmap ---------- */
.vert{margin-bottom:30px}
.vert-h{display:flex;align-items:center;gap:12px;padding-bottom:10px;margin-bottom:14px;
  border-bottom:2px solid var(--lime)}
.vert-h h2{font-size:21px}
.vert-h .n{color:var(--muted);font-size:12px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(335px,1fr));gap:11px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 17px;
  box-shadow:var(--shadow);display:flex;flex-direction:column;gap:9px}
.rcard.s-run{border-left:4px solid var(--win)}
.rcard.s-val{border-left:4px solid var(--blue)}
.rcard.s-blk{border-left:4px solid var(--loss)}
.rcard.s-bkl{border-left:4px solid var(--line-2)}
.rc-key{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);flex-wrap:wrap}
.rc-key a{font-family:var(--mono);font-size:11px;color:var(--blue);text-decoration:none;font-weight:600}
.rc-key a:hover{text-decoration:underline}
.rc-key b{color:var(--ink);font-weight:600;font-size:12.5px}
.rcard h3{font-size:15.5px;line-height:1.35;color:var(--ink)}
.rc-note{margin:0;font-size:12.5px;color:var(--ink-2);line-height:1.6}
.rc-block{margin:0;font-size:12px;color:var(--loss);line-height:1.5;
  background:var(--loss-bg);border:1px solid var(--loss-line);border-radius:10px;padding:8px 11px}
.rc-fam{margin-top:auto;padding-top:10px;border-top:1px dashed var(--line-2);font-size:11.5px;
  color:var(--muted)}
.rc-fam button{background:none;border:0;padding:0;cursor:pointer;color:var(--blue);font:inherit;
  font-weight:600;text-align:left}
.rc-fam button:hover{text-decoration:underline}
.st{font-size:10px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap;
  border:1px solid var(--line);color:var(--muted);letter-spacing:.03em}
.st.s-run{background:var(--win-bg);border-color:var(--win-line);color:var(--win)}
.st.s-val{background:var(--accent-soft);border-color:var(--blue);color:var(--blue)}
.st.s-blk{background:var(--loss-bg);border-color:var(--loss-line);color:var(--loss)}

.none{padding:56px 20px;text-align:center;color:var(--muted);background:var(--surface);
  border:1px dashed var(--line-2);border-radius:var(--r)}
.foot{margin-top:32px;background:var(--blue);color:#FFFFFF;border-radius:var(--r);
  padding:18px 22px;font-size:12.5px;line-height:1.7;max-width:none}
.foot b{color:var(--lime);font-weight:600}
.foot .lb{display:block;color:var(--lime);font-size:10px;font-weight:700;letter-spacing:.15em;
  text-transform:uppercase;margin-bottom:7px}
:root[data-theme="dark"] .foot,:root:not([data-theme="light"]) .foot{background:#16325C;color:#E7EDF8}

/* ---------- ganho acumulado ---------- */
.mtn{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:20px 22px 14px;box-shadow:var(--shadow);margin-bottom:22px}
.mtn h4{margin:0 0 4px;font-size:10px;letter-spacing:.28em;text-transform:uppercase;
  color:var(--muted);font-weight:700}
.mtn svg{display:block;width:100%;height:auto;overflow:visible}
.mtn-foot{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;
  padding-top:12px;margin-top:6px;border-top:1px solid var(--line);font-size:12px;font-weight:600}
.mtn-foot span{display:flex;align-items:center;gap:7px;color:var(--muted)}
.mtn-foot span i{width:8px;height:8px;border-radius:50%;background:var(--line-2)}
.mtn-foot .now{color:var(--loss)} .mtn-foot .now i{background:var(--loss)}
.mtn-foot .goal{color:var(--head)} .mtn-foot .goal i{border-radius:2px;background:var(--head)}
.mtn-empty{text-align:center;padding:38px 20px 46px}
.mtn-empty p{margin:0 auto;max-width:52ch;color:var(--muted);font-size:13.5px;line-height:1.65}
.mtn-empty b{color:var(--head)}
.rank{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:18px 22px 20px;box-shadow:var(--shadow)}
.rank h4{margin:0 0 15px;font-size:10px;letter-spacing:.28em;text-transform:uppercase;
  color:var(--muted);font-weight:700}
.rrow{display:grid;grid-template-columns:120px 1fr 168px;align-items:center;gap:14px;
  padding:7px 0;background:none;border:0;width:100%;text-align:left;cursor:pointer;
  border-radius:9px;font:inherit;color:inherit}
.rrow:hover{background:var(--panel)}
.rrow[aria-current="true"] .rname{color:var(--loss)}
.rname{font-size:14px;font-weight:600;color:var(--ink)}
.rbar{height:12px;border-radius:999px;background:var(--raise);overflow:hidden}
.rbar i{display:block;height:100%;border-radius:999px;
  background:linear-gradient(90deg,var(--blue),var(--loss))}
.rval{display:flex;align-items:baseline;justify-content:flex-end;gap:9px}
.rval b{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:15px;font-weight:700;
  color:var(--loss);letter-spacing:-.03em}
.rval span{font-size:11.5px;color:var(--muted)}
[hidden]{display:none!important}
@media (max-width:720px){
  body{padding:5px}
  .frame{border-radius:16px}
  .top{gap:12px;padding:0 14px;top:5px;border-radius:15px 15px 0 0}
  .tabs{gap:2px}.tabs button{padding:7px 11px;font-size:12.5px}
  main{padding:20px 14px 64px}
  .pagehead h1{font-size:25px}
  .search{margin-left:0}
  thead th{top:62px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

</style>
</head>
<body>

<div class="frame">
<header class="top">
  <span class="dots"><i></i><i></i><i></i></span>
  <div class="brand"><b>gogroup</b> <span>MATRIZ CRO</span></div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-view="matriz" aria-selected="true">Matriz de testes</button>
    <button role="tab" data-view="testes" aria-selected="false">Testes A/B</button>
    <button role="tab" data-view="ganho" aria-selected="false">Ganho acumulado</button>
    <button role="tab" data-view="roadmap" aria-selected="false">Roadmap</button>
  </nav>
  <div class="stamp"><i></i><span id="stamp"></span></div>
  <button class="themebtn" id="theme" title="Alternar tema" aria-label="Alternar tema">◐</button>
</header>

<main>
<section id="v-matriz" role="tabpanel">
  <div class="pagehead">
    <div>
      <span class="eyebrow" id="mx-eyebrow">Teste A/B</span>
      <h1 id="mx-h1">Matriz de <em>testes</em></h1>
      <p class="sub" id="mx-stats"></p>
    </div>
    <div class="legend">
      <span><i class="lg-w"></i><span id="lg-winner">Vencedor</span></span>
      <span><i class="lg-c"></i><span id="lg-control">Controle venceu</span></span>
      <span><i class="lg-i"></i><span id="lg-inconclusive">Inconclusivo</span></span>
      <span><i class="lg-r"></i><span id="lg-running">Em teste</span></span>
    </div>
  </div>
  <div class="controls">
    <div class="field"><select id="f-res">
      <option id="f-res-all" value="">Todos os resultados</option>
      <option id="f-res-winner" value="winner">Vencedor</option>
      <option id="f-res-control" value="control">Controle venceu</option>
      <option id="f-res-inconclusive" value="inconclusive">Inconclusivo</option>
      <option id="f-res-running" value="running">Em teste</option>
    </select></div>
    <div class="field"><select id="f-store"><option id="f-store-all" value="">Todas as marcas</option></select></div>
    <div class="field"><select id="f-area"><option id="f-area-all" value="">Todas as áreas</option></select></div>
    <div class="seg" id="f-scope">
      <button id="f-scope-all" data-scope="" aria-pressed="true">Todas</button>
      <button id="f-scope-multi" data-scope="multi" aria-pressed="false">Multimarca</button>
      <button id="f-scope-solo" data-scope="solo" aria-pressed="false">Exclusivas</button>
    </div>
    <div class="search"><input id="f-q" type="search" placeholder="Buscar família ou teste…"></div>
  </div>
  <div class="tablewrap"><table id="mx"><thead></thead><tbody></tbody></table></div>
  <p class="foot" id="mx-foot"></p>
</section>

<section id="v-testes" role="tabpanel" hidden>
  <div class="pagehead">
    <div><span class="eyebrow" id="tt-eyebrow">Resultados</span><h1 id="tt-h1">Testes <em>A/B</em></h1><p class="sub" id="tt-stats"></p></div>
  </div>
  <div class="kpis" id="tt-kpis"></div>
  <div class="controls">
    <div class="field"><select id="t-store"><option id="t-store-all" value="">Todas as marcas</option></select></div>
    <div class="field"><select id="t-res">
      <option id="t-res-all" value="">Todos os resultados</option>
      <option id="t-res-winner" value="winner">Vencedor</option>
      <option id="t-res-control" value="control">Controle venceu</option>
      <option id="t-res-inconclusive" value="inconclusive">Inconclusivo</option>
      <option id="t-res-running" value="running">Em teste</option>
    </select></div>
    <div class="field"><select id="t-status">
      <option id="t-status-all" value="">Todos os status</option>
      <option id="t-status-running" value="Running">Rodando</option>
      <option id="t-status-paused" value="Paused">Pausado</option>
      <option id="t-status-done" value="Done">Finalizado</option>
    </select></div>
    <div class="field"><select id="t-area"><option id="t-area-all" value="">Todas as áreas</option></select></div>
    <div class="field"><select id="t-sort">
      <option id="t-sort-date" value="date">Ordenar: data</option>
      <option id="t-sort-rpv" value="rpv">Ordenar: RPV</option>
      <option id="t-sort-cr" value="cr">Ordenar: CR</option>
      <option id="t-sort-aov" value="aov">Ordenar: AOV</option>
      <option id="t-sort-incr" value="incr">Ordenar: incremento</option>
      <option id="t-sort-vis" value="vis">Ordenar: visitantes</option>
    </select></div>
    <span id="t-chip"></span>
    <div class="search"><input id="t-q" type="search" placeholder="Buscar teste…"></div>
  </div>
  <div class="cards" id="tt-cards"></div>
  <p class="foot" id="tt-foot"></p>
</section>

<section id="v-ganho" role="tabpanel" hidden>
  <div class="pagehead">
    <div><span class="eyebrow" id="gn-eyebrow">Jornada</span><h1 id="gn-h1">Ganho <em>acumulado</em></h1>
      <p class="sub" id="gn-stats"></p></div>
  </div>
  <div class="controls">
    <div class="seg" id="g-co"></div>
    <div class="field"><select id="g-store"></select></div>
    <div class="field"><select id="g-goal">
      <option id="g-goal-10" value="10">Meta +10%</option>
      <option id="g-goal-20" value="20">Meta +20%</option>
      <option id="g-goal-30" value="30" selected>Meta +30%</option>
      <option id="g-goal-50" value="50">Meta +50%</option>
    </select></div>
  </div>
  <div class="kpis" id="gn-kpis"></div>
  <div class="mtn">
    <h4 id="gn-mtn-h4">Jornada até o topo</h4>
    <div id="gn-chart"></div>
  </div>
  <div class="rank" id="gn-rank"></div>
  <p class="foot" id="gn-foot"></p>
</section>

<section id="v-roadmap" role="tabpanel" hidden>
  <div class="pagehead">
    <div><span class="eyebrow" id="rd-eyebrow">Próximos</span><h1 id="rd-h1">Roadmap de <em>testes</em></h1><p class="sub" id="rd-stats"></p></div>
  </div>
  <div class="controls">
    <div class="seg" id="r-kind">
      <button id="r-kind-ab" data-kind="ab" aria-pressed="true">Testes A/B</button>
      <button id="r-kind-all" data-kind="" aria-pressed="false">Tudo</button>
    </div>
    <div class="field"><select id="r-vert">
      <option id="r-vert-all" value="">Todas as verticais</option>
      <option value="beaute">Gobeaute</option>
      <option value="jump">GoJump</option>
    </select></div>
    <div class="field"><select id="r-brand"><option id="r-brand-all" value="">Todas as marcas</option></select></div>
    <div class="field"><select id="r-status"><option id="r-status-all" value="">Todos os status</option></select></div>
    <div class="search"><input id="r-q" type="search" placeholder="Buscar teste ou chave…"></div>

<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const STORES  = JSON.parse(document.getElementById('stores').textContent);
const VERTS   = JSON.parse(document.getElementById('verts').textContent);
const UPDATED = JSON.parse(document.getElementById('updated').textContent);
const VNAME   = Object.fromEntries(VERTS);
const storesOf = v => STORES.filter(s=>s.v===v);
const vertOf = (storeKey) => STORES.find(s=>s.k===storeKey)?.v;
const SN = Object.fromEntries(STORES.map(s=>[s.k,s.n]));
// Cada aba escolhe seu próprio idioma a partir do seu próprio filtro (não existe uma vertical
// global): Matriz/Testes olham a loja selecionada, Ganho olha o toggle de vertical, Roadmap olha
// o filtro de vertical. Quando o filtro mistura as duas verticais, fica em português (padrão).
const langMatrix  = () => (S.store  && vertOf(S.store)  === 'jump') ? 'en' : 'pt';
const langTestes  = () => (S.tStore && vertOf(S.tStore) === 'jump') ? 'en' : 'pt';
const RES = {
  pt: {winner:'Vencedor', control:'Controle venceu', inconclusive:'Inconclusivo', running:'Em teste', paused:'Pausado'},
  en: {winner:'Winner',   control:'Control won',      inconclusive:'Inconclusive', running:'Running',  paused:'Paused'},
};
const STATUS = {
  pt: {Running:'Rodando', Paused:'Pausado', Done:'Finalizado'},
  en: {Running:'Running', Paused:'Paused',  Done:'Done'},
};
const AREA_EN = {PDP:'PDP', CARRINHO:'CART', HOME:'HOME', 'COLEÇÃO':'COLLECTION', TEMA:'THEME',
                 FEATURE:'FEATURE', 'PREÇO':'PRICE', IMAGEM:'IMAGE', OUTRO:'OTHER'};
const trArea = (area, lang) => lang === 'en' ? (AREA_EN[area] ?? area) : area;
const nf1 = new Intl.NumberFormat('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});
const nf2 = new Intl.NumberFormat('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const nf0 = new Intl.NumberFormat('pt-BR',{maximumFractionDigits:0});
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct = v => v==null ? '—' : (v>0?'+':'') + nf1.format(v) + '%';
const pl = (n, s, p) => `${n} ${n===1 ? s : p}`;

/* Dinheiro. Cada loja fatura na sua moeda e não há conversão aqui, então valores em dinheiro
   só são somados dentro de uma mesma moeda — somaCur devolve um total por moeda. */
const SC  = Object.fromEntries(STORES.map(s=>[s.k, s.c || 'BRL']));
const SYM = {BRL:'R$', USD:'US$', EUR:'€', GBP:'£', AUD:'A$', CAD:'C$'};
const sym = c => SYM[c] || (c ? c+' ' : '');
const money = (v, cur) => v==null ? '—' : sym(cur) + ' ' + nf2.format(v);
// Soma `pick` por moeda da loja. Devolve [[moeda, total], ...] em ordem de magnitude.
const somaCur = (ts, pick = t=>t.incr) => {
  const by = new Map();
  for (const t of ts) { const c = SC[t.store]; by.set(c, (by.get(c) ?? 0) + (pick(t) || 0)); }
  return [...by].sort((a,b)=>Math.abs(b[1])-Math.abs(a[1]));
};
const fmtCur = (pares, {assinado = true} = {}) => pares.length
  ? pares.map(([c,v])=> (assinado ? (v>0?'+':'−') : '') + sym(c) + ' ' +
      compact(assinado ? Math.abs(v) : v)).join(' · ')
  : '—';
const sign = v => v==null ? 'zero' : (v>0.05 ? 'pos' : v<-0.05 ? 'neg' : 'zero');
const kind = t => t.cls==='paused' ? 'running' : t.cls;   // "em teste" agrupa rodando + pausado
const dt = s => s ? new Date(s).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit'}) : null;
const compact = v => Math.abs(v)>=1e6 ? (v/1e6).toFixed(1).replace('.',',')+'M'
                   : Math.abs(v)>=1e3 ? Math.round(v/1e3)+'k' : nf0.format(v);

/* ---------- famílias ---------- */
const FAMS = [];
for (const t of DATA) {
  let f = FAMS.find(x=>x.name===t.family);
  if (!f) FAMS.push(f = {name:t.family, area:t.area, tests:[]});
  f.tests.push(t);
}
for (const f of FAMS) {
  f.byStore = {};
  for (const s of STORES) {
    const ts = f.tests.filter(t=>t.store===s.k)
      .sort((a,b)=> new Date(b.start) - new Date(a.start));
    if (ts.length) f.byStore[s.k] = ts;
  }
  f.nStores = Object.keys(f.byStore).length;
  f.counts = f.tests.reduce((a,t)=>(a[kind(t)]=(a[kind(t)]||0)+1, a), {});
  f.hasWinner = f.tests.some(t=>t.cls==='winner');
}
FAMS.sort((a,b)=> b.nStores - a.nStores || b.tests.length - a.tests.length
                || a.name.localeCompare(b.name,'pt-BR'));
const AREAS = [...new Set(FAMS.map(f=>f.area))].sort((a,b)=>a.localeCompare(b,'pt-BR'));

const storeOptions = VERTS.map(([v,label]) => {
  const ss = STORES.filter(s=>s.v===v);

}).join('');

function cellHTML(ts, famName, storeKey, lang) {
  const t = ts[0], k = kind(t);

  const tipText = ts.map(x=>`${x.name} — RPV ${pct(x.rpvL)} (${STATUS[lang][x.status]})`).join('\n');
  return `<button class="cell c-${t.cls}" data-tip="${esc(tipText)}"
      data-fam="${esc(famName)}" data-store="${storeKey}">
      <span class="lab"><i></i>${lab}${extra}</span>
      <span class="rpv num ${sign(t.rpvL)}">RPV ${pct(t.rpvL)}</span></button>`;
}
function obarHTML(c, total) {
  const seg = (cls,n) => n ? `<i class="${cls}" style="width:${n/total*100}%"></i>` : '';
  return `<span class="obar">${seg('w',c.winner)}${seg('c',c.control)}${seg('r',c.running)}${seg('i',c.inconclusive)}</span>`;
}

  const q = S.q.trim().toLowerCase();
  const rows = FAMS.filter(f=>{
    if (S.area && f.area!==S.area) return false;

      if (!pool.some(t=>kind(t)===S.res)) return false;
    }

  document.querySelector('#mx thead').innerHTML =

  document.querySelector('#mx tbody').innerHTML = rows.length ? rows.map(f=>{
    const n = f.tests.length;
    return `<tr><th>
        <button class="famname" data-fam="${esc(f.name)}">${esc(f.name)}</button>
        <span class="tags"><span class="tag area">${trArea(f.area, lang)}</span>
          <span class="tag n">${f.nStores} ${lang==='en' ? (f.nStores===1?'brand':'brands') : (f.nStores===1?'marca':'marcas')}</span>

        ${obarHTML(f.counts, n)}
      </th>${cols.map(s=> f.byStore[s.k]

  const multi = FAMS.filter(f=>f.nStores>1).length;
  const win = FAMS.filter(f=>f.hasWinner).length;
  const cov = FAMS.reduce((a,f)=>a+f.nStores,0) / FAMS.length / STORES.length * 100;
  document.getElementById('mx-stats').innerHTML = lang==='en'
    ? `<b>${FAMS.length}</b> families · <b>${multi}</b> tested in 2+ brands · <b>${win}</b> with confirmed winner · avg. coverage <b>${Math.round(cov)}%</b>`
      + (rows.length!==FAMS.length ? ` — showing ${rows.length}` : '')
    : `<b>${FAMS.length}</b> famílias · <b>${multi}</b> testadas em 2+ marcas · <b>${win}</b> com vencedor confirmado · cobertura média <b>${Math.round(cov)}%</b>`
      + (rows.length!==FAMS.length ? ` — exibindo ${rows.length}` : '');
  document.getElementById('mx-foot').innerHTML = lang==='en'

    : `<span class="lb">Como ler</span>Cada célula mostra o teste mais recente daquela marca; <b>+n</b> indica testes anteriores da mesma família (passe o mouse para ver todos). O <b>RPV</b> é o lift da melhor variação sobre o controle. A barra sob o nome da família resume os desfechos de todos os seus testes. Clique numa célula ou no nome da família para abrir os testes correspondentes.`;
}

/* ---------- testes ---------- */
function tileHTML(label, c, v, lift, cur) {
  const f = cur ? x => money(x, cur) : x => x==null ? '—' : nf2.format(x)+'%';
  return `<div class="tile"><h5>${label}</h5>
    <div class="ab num">${f(c)}<em>→</em>${f(v)}</div>
    <div class="lift num ${sign(lift)}">${pct(lift)}</div></div>`;
}
function cardHTML(t, lang) {
  const k = kind(t);
  const dates = t.end ? `${dt(t.start)} → ${dt(t.end)}` : `${lang==='en'?'since':'desde'} ${dt(t.start)}`;
  const days = t.end ? Math.round((new Date(t.end)-new Date(t.start))/864e5) : null;
  const p = t.pBest, pc = t.pCtrl;
  const sigTxt = p==null ? '—'
    : (p>=95 || pc>=95) ? (lang==='en'?'Significant':'Significativo') : (lang==='en'?'Not significant':'Sem significância');
  const sigCls = p==null ? 'zero' : (p>=95 ? 'pos' : pc>=95 ? 'neg' : 'zero');
  const winnerLb = lang==='en' ? 'Winner' : 'Vencedor';
  const winner = t.cls==='winner' ? `${winnerLb}: ${t.varName}`
    : t.cls==='control' ? `${winnerLb}: ${t.ctrlName}`
    : t.cls==='inconclusive' ? (lang==='en'?'No winner':'Sem vencedor') : null;
  return `<article class="card k-${t.cls}">
    <div class="card-h">
      <div>
        <h3>${esc(t.name)}</h3>
        <div class="card-meta"><b>${SN[t.store]}</b><em>·</em>${dates}${days!=null?` <em>(${days}d)</em>`:''}
          <em>·</em>${t.type}<em>·</em>${esc(t.family)}
          <em>·</em><span class="num">${compact(t.visitors)} ${lang==='en'?'visitors':'visitantes'}</span>
          ${t.nvar>2?`<em>·</em>${t.nvar} ${lang==='en'?'variations':'variações'}`:''}</div>
      </div>
      <div class="pills">
        <span class="pill">${STATUS[lang][t.status]}</span>
        ${winner?`<span class="pill k-${t.cls}">${esc(winner)}</span>`:''}
      </div>
    </div>
    <div class="tiles">
      ${tileHTML('CR', t.crC, t.crV, t.crL)}
      ${tileHTML('RPV', t.rpvC, t.rpvV, t.rpvL, SC[t.store])}
      ${tileHTML('AOV', t.aovC, t.aovV, t.aovL, SC[t.store])}
      ${tileHTML('Add to cart', t.atcC, t.atcV, t.atcL)}
      <div class="tile sig"><h5>${lang==='en'?'Significance':'Significância'}</h5>
        <div class="big ${sigCls}">${sigTxt}</div>
        <div class="ab num">${p==null?'—':`P(${lang==='en'?'best':'melhor'}) ${nf1.format(p)}%`}</div></div>
      <div class="tile"><h5>${lang==='en'?'RPV increment':'Incremento RPV'}</h5>
        <div class="lift num ${sign(t.incr)}" style="margin-top:6px">${t.incr==null?'—'
          :(t.incr>0?'+':'−')+sym(SC[t.store])+' '+compact(Math.abs(t.incr))}</div>
        <div class="ab num" style="color:var(--muted)">${lang==='en'?'on the variation':'na variação'}</div></div>
    </div></article>`;
}
function renderTests() {
  const lang = langTestes();
  document.getElementById('v-testes').lang = lang;
  document.getElementById('tt-eyebrow').textContent = lang==='en' ? 'Results' : 'Resultados';
  document.getElementById('tt-h1').innerHTML = lang==='en' ? '<em>A/B</em> tests' : 'Testes <em>A/B</em>';
  document.getElementById('t-store-all').textContent = lang==='en' ? 'All brands' : 'Todas as marcas';
  document.getElementById('t-res-all').textContent = lang==='en' ? 'All results' : 'Todos os resultados';
  document.getElementById('t-res-winner').textContent = RES[lang].winner;
  document.getElementById('t-res-control').textContent = RES[lang].control;
  document.getElementById('t-res-inconclusive').textContent = RES[lang].inconclusive;
  document.getElementById('t-res-running').textContent = RES[lang].running;

  document.getElementById('t-status-running').textContent = STATUS[lang].Running;

  document.getElementById('t-status-done').textContent = STATUS[lang].Done;

  document.getElementById('t-sort-cr').textContent = lang==='en' ? 'Sort: CR' : 'Ordenar: CR';
  document.getElementById('t-sort-aov').textContent = lang==='en' ? 'Sort: AOV' : 'Ordenar: AOV';

  document.getElementById('t-sort-vis').textContent = lang==='en' ? 'Sort: visitors' : 'Ordenar: visitantes';
  document.getElementById('t-q').placeholder = lang==='en' ? 'Search test…' : 'Buscar teste…';

  const q = S.tQ.trim().toLowerCase();
  let list = DATA.filter(t=>{
    if (S.tStore && t.store!==S.tStore) return false;
    if (S.tRes && kind(t)!==S.tRes) return false;
    if (S.tStatus && t.status!==S.tStatus) return false;
    if (S.tArea && t.area!==S.tArea) return false;
    if (S.tFam && t.family!==S.tFam) return false;
    if (q && !t.name.toLowerCase().includes(q) && !t.family.toLowerCase().includes(q)) return false;
    return true;
  });
  const by = {date:t=>new Date(t.start).getTime(), rpv:t=>t.rpvL??-999, cr:t=>t.crL??-999,
              aov:t=>t.aovL??-999, incr:t=>t.incr??-1e12, vis:t=>t.visitors};
  list = list.sort((a,b)=> by[S.tSort](b) - by[S.tSort](a));

  document.getElementById('tt-cards').innerHTML = list.length
    ? list.map(t=>cardHTML(t, lang)).join('')
    : `<p class="none">${lang==='en' ? 'No test matches these filters.' : 'Nenhum teste com esses filtros.'}</p>`;

  const avg = (arr,f) => { const v=arr.map(f).filter(x=>x!=null); return v.length? v.reduce((a,b)=>a+b,0)/v.length : null; };
  const fin = list.filter(t=>t.end);
  const incr = somaCur(list);
  const testWord = lang==='en' ? ['test','tests'] : ['teste','testes'];
  const kpis = lang==='en' ? [
    ['RPV (lift)',        pct(avg(list,t=>t.rpvL)), pl(list.length,...testWord), sign(avg(list,t=>t.rpvL))],
    ['RPV increment',     fmtCur(incr),
                          incr.length>1 ? 'sum on the variation, by currency' : 'sum on the variation',
                          incr.length>1 ? 'moedas' : sign(incr[0]?.[1])],
    ['CR (lift)',         pct(avg(list,t=>t.crL)),  pl(list.length,...testWord), sign(avg(list,t=>t.crL))],
    ['AOV (lift)',        pct(avg(list,t=>t.aovL)), pl(list.length,...testWord), sign(avg(list,t=>t.aovL))],
    ['Add to cart (lift)',pct(avg(list,t=>t.atcL)), pl(list.length,...testWord), sign(avg(list,t=>t.atcL))],
    ['Avg. duration',     fin.length? Math.round(avg(fin,t=>(new Date(t.end)-new Date(t.start))/864e5))+'d' : '—',
                          `${fin.length} done`, 'zero'],
  ] : [
    ['RPV (lift)',        pct(avg(list,t=>t.rpvL)), pl(list.length,...testWord), sign(avg(list,t=>t.rpvL))],
    ['Incremento RPV',    fmtCur(incr),
                          incr.length>1 ? 'soma na variação, por moeda' : 'soma na variação',
                          incr.length>1 ? 'moedas' : sign(incr[0]?.[1])],
    ['CR (lift)',         pct(avg(list,t=>t.crL)),  pl(list.length,...testWord), sign(avg(list,t=>t.crL))],
    ['AOV (lift)',        pct(avg(list,t=>t.aovL)), pl(list.length,...testWord), sign(avg(list,t=>t.aovL))],
    ['Add to cart (lift)',pct(avg(list,t=>t.atcL)), pl(list.length,...testWord), sign(avg(list,t=>t.atcL))],
    ['Duração média',     fin.length? Math.round(avg(fin,t=>(new Date(t.end)-new Date(t.start))/864e5))+'d' : '—',
                          `${fin.length} finalizados`, 'zero'],
  ];
  document.getElementById('tt-kpis').innerHTML = kpis.map(([h,v,n,c])=>
    `<div class="kpi"><h4>${h}</h4><div class="v num ${c}">${v}</div><div class="n">${n}</div></div>`).join('');

  const c = list.reduce((a,t)=>(a[kind(t)]=(a[kind(t)]||0)+1,a),{});
  document.getElementById('tt-stats').innerHTML = lang==='en'
    ? `<b>${list.length}</b> of ${DATA.length} tests · <b>${c.winner||0}</b> winners · <b>${c.control||0}</b> control won · <b>${c.inconclusive||0}</b> inconclusive · <b>${c.running||0}</b> running`
    : `<b>${list.length}</b> de ${DATA.length} testes · <b>${c.winner||0}</b> vencedores · <b>${c.control||0}</b> controle venceu · <b>${c.inconclusive||0}</b> inconclusivos · <b>${c.running||0}</b> em teste`;
  document.getElementById('t-chip').innerHTML = S.tFam
    ? `<span class="chip">${esc(S.tFam)}<button id="t-clearfam" aria-label="${lang==='en'?'Remove family filter':'Remover filtro de família'}">×</button></span>` : '';
  document.getElementById('tt-foot').innerHTML = lang==='en'
    ? `<span class="lb">Criteria</span><b>Winner</b> = the best variation has ≥95% probability of being the best in RPV (revenue per visitor), the goal of every test. <b>Control won</b> = the control hits that threshold. Below that, <b>inconclusive</b>. In A/B/C tests, we compare the highest-RPV variation against control. Increment = (variation RPV − control RPV) × variation visitors, within the test window, <b>in the store's currency</b> — no conversion, so totals that cross currencies show broken out by currency.`
    : `<span class="lb">Critério</span><b>Vencedor</b> = a melhor variação tem ≥95% de probabilidade de ser a melhor em RPV (receita por visitante), a meta de todos os testes. <b>Controle venceu</b> = o controle atinge esse limite. Abaixo disso, <b>inconclusivo</b>. Em testes A/B/C, comparamos a variação de maior RPV contra o controle. Incremento = (RPV variação − RPV controle) × visitantes da variação, no período do teste, <b>na moeda da loja</b> — sem conversão, então totais que cruzam moedas aparecem quebrados por moeda.`;
}

/* ---------- ganho acumulado ---------- */
document.getElementById('g-co').innerHTML = VERTS.map(([v,n],i)=>
  `<button data-co="${v}" aria-pressed="${i===0}">${n}</button>`).join('');
// Peso da loja na média da vertical. Receita observada é o peso natural, mas só é comparável
// dentro de uma mesma moeda — numa vertical que mistura moedas caímos para visitantes, que é
// adimensional. `baseDoPeso` diz qual dos dois está em uso, para a legenda não mentir.
const REV = {}, VIS = {};
for (const s of STORES) {
  const ts = DATA.filter(t=>t.store===s.k);
  REV[s.k] = ts.reduce((a,t)=>a+(t.revenue||0), 0);
  VIS[s.k] = ts.reduce((a,t)=>a+(t.visitors||0), 0);
}
const umaMoeda   = ss => new Set(ss.map(s=>s.c||'BRL')).size <= 1;
const pesosDe    = ss => umaMoeda(ss) ? REV : VIS;
const baseDoPeso = ss => umaMoeda(ss) ? 'receita observada' : 'visitantes';
const baseDoPesoEN = ss => baseDoPeso(ss) === 'receita observada' ? 'observed revenue' : 'visitors';
const langGanho = () => S.gCo === 'jump' ? 'en' : 'pt';
const winnersOf = k => DATA.filter(t=>t.store===k && t.cls==='winner' && t.rpvL!=null)
  .sort((a,b)=> (a.end||a.start).localeCompare(b.end||b.start));
const compound = ts => ts.reduce((a,t)=>a*(1+t.rpvL/100), 1);
const cumOf = k => (compound(winnersOf(k)) - 1) * 100;

function curve(scope) {           // scope: chave de loja ou chave de vertical
  if (!VNAME[scope]) {
    let c = 1;
    return {pts: winnersOf(scope).map(t=>{ c*=(1+t.rpvL/100);
      return {v:(c-1)*100, date:t.end||t.start, name:t.name, lift:t.rpvL, store:t.store}; }),
      cum: cumOf(scope)};
  }
  const ss = storesOf(scope);
  const PESO = pesosDe(ss);
  const evts = ss.flatMap(s=>winnersOf(s.k)).sort((a,b)=>(a.end||a.start).localeCompare(b.end||b.start));
  const W = ss.reduce((a,s)=>a+PESO[s.k], 0) || 1;
  const pts = evts.map((t,i)=>{
    const upto = evts.slice(0, i+1);
    const agg = ss.reduce((a,s)=>
      a + PESO[s.k] * (compound(upto.filter(x=>x.store===s.k)) - 1) * 100, 0) / W;
    return {v:agg, date:t.end||t.start, name:t.name, lift:t.rpvL, store:t.store};
  });
  return {pts, cum: pts.length ? pts[pts.length-1].v : 0};
}

function mountainSVG(cum, pts, goal, label, lang) {
  const W=1000, H=520, base=452, top=86, x0=86, xs=612;
  const f = Math.max(0, Math.min(1, cum/goal));
  const P = t => [x0 + t*(xs-x0), base - t*(base-top)];
  const [cx,cy] = P(f);
  const done = cum >= goal;
  const dots = pts.map(p=>{ const t=Math.max(0,Math.min(1,p.v/goal)); const [x,y]=P(t);
    return {...p, x, y, t}; });
  const lab = d => new Date(d).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
  const every = Math.ceil(dots.length/6);
  const ariaLabel = lang==='en'
    ? `Accumulated gain of ${nf1.format(cum)}% towards the ${goal}% goal`
    : `Ganho acumulado de ${nf1.format(cum)}% em direção à meta de ${goal}%`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${ariaLabel}">
    <defs>
      <linearGradient id="climb" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0%" stop-color="var(--loss)" stop-opacity=".05"/>
        <stop offset="100%" stop-color="var(--loss)" stop-opacity=".30"/>
      </linearGradient>
    </defs>
    <g fill="var(--accent-soft)">
      <polygon points="-40,${base} 150,236 340,${base}" opacity=".7"/>
      <polygon points="700,${base} 850,196 1000,${base}" opacity=".7"/>
      <polygon points="560,${base} 700,286 840,${base}" opacity=".45"/>
      <polygon points="240,${base} 400,306 560,${base}" opacity=".45"/>
    </g>
    <polygon points="${x0},${base} ${xs},${top} 1040,${base}" fill="var(--accent-soft)" opacity=".95"/>
    <polygon points="${x0},${base} ${cx},${cy} ${cx},${base}" fill="url(#climb)"/>
    <line x1="0" y1="${base}" x2="${W}" y2="${base}" stroke="var(--line)" stroke-width="1.5"/>
    <line x1="${cx}" y1="${cy}" x2="${xs}" y2="${top}" stroke="var(--loss)" stroke-width="3"
      stroke-dasharray="9 9" opacity=".45" stroke-linecap="round"/>
    <line x1="${x0}" y1="${base}" x2="${cx}" y2="${cy}" stroke="var(--loss)" stroke-width="4"
      stroke-linecap="round"/>
    <g>
      <line x1="${xs}" y1="${top}" x2="${xs}" y2="${top-52}" stroke="var(--head)" stroke-width="3.5"/>
      <polygon points="${xs},${top-52} ${xs+44},${top-41} ${xs},${top-30}" fill="var(--head)"/>
      <text x="${xs+56}" y="${top-34}" font-size="19" font-weight="700" fill="var(--head)">${lang==='en'?'GOAL':'META'} +${goal}%</text>
    </g>
    ${dots.map((d,i)=>`<g><title>${esc(d.name)} — ${pct(d.lift)} (${lab(d.date)})</title>
       <circle cx="${d.x}" cy="${d.y}" r="7.5" fill="var(--surface)" stroke="var(--loss)" stroke-width="3"/>
       ${i%every===0?`<text x="${d.x+14}" y="${d.y+6}" font-size="15" font-weight="600"
         fill="var(--muted)">${lab(d.date)}</text>`:''}</g>`).join('')}
    <circle cx="${cx}" cy="${cy}" r="21" fill="var(--loss)" opacity=".14"/>
    <circle cx="${cx}" cy="${cy}" r="13" fill="var(--surface)" stroke="var(--loss)" stroke-width="3.5"/>
    <circle cx="${cx}" cy="${cy}" r="5" fill="var(--loss)"/>
    <g transform="translate(${f>0.8 ? cx-306 : cx+30},${cy-46})">
      <rect width="270" height="74" rx="14" fill="var(--surface)" stroke="var(--line)"/>
      <text x="20" y="34" font-size="26" font-weight="700" fill="var(--loss)">${pct(cum)} RPV</text>
      <text x="20" y="57" font-size="15" fill="var(--muted)">${esc(label)}${done?(lang==='en'?' · goal reached':' · meta superada'):''}</text>
    </g>
  </svg>`;
}

  document.getElementById('gn-eyebrow').textContent = lang==='en' ? 'Journey' : 'Jornada';

  document.getElementById('g-goal-50').textContent = lang==='en' ? 'Goal +50%' : 'Meta +50%';
  const byStoreLb = lang==='en' ? 'By store' : 'Por loja';

  const co = S.gCo, goal = +S.gGoal;

  const sel = document.getElementById('g-store');

    sel.dataset.co = co;

    sel.value = co;
  }
  const scope = S.gStore;
  const isCo = !!VNAME[scope];
  const label = VNAME[scope] ?? SN[scope];

  if (!mine.length) {
    const ab = ROADMAP.filter(r=>r.vert===co && r.kind==='ab').length;

      planned — the track starts once the stores go live in the tool.</p></div>` : `<div class="mtn-empty">
      ${mountainSVG(0, [], goal, VNAME[co], lang)}
      <p style="margin-top:18px">Nenhuma loja d${co==='jump'?'o':'a'} ${VNAME[co]} está conectada ao Elevate,
      então não há resultado medido para acumular. O roadmap já tem <b>${ab} teste${ab===1?'':'s'} A/B</b>
      planejado${ab===1?'':'s'} — a trilha começa quando as lojas entrarem na ferramenta.</p></div>`;
    const emptyKpiLabels = lang==='en'
      ? ['Accumulated gain','Winners','Increment','Tests run']
      : ['Ganho acumulado','Vencedores','Incremento','Testes rodados'];
    document.getElementById('gn-kpis').innerHTML = emptyKpiLabels
      .map(t=>`<div class="kpi"><h4>${t}</h4><div class="v">—</div><div class="n">${lang==='en'?'no data':'sem dados'}</div></div>`).join('');
    const brands = [...new Set(ROADMAP.filter(r=>r.vert===co && r.brand).map(r=>r.brand))];
    document.getElementById('gn-rank').innerHTML = `<h4>${byStoreLb}</h4>
      <p class="mtn-empty" style="padding:10px 0;text-align:left"><span style="color:var(--muted);font-size:13px">

    document.getElementById('gn-stats').innerHTML = lang==='en'
      ? `<b>${VNAME[co]}</b> · ${brands.length} brands in the roadmap · no data measured yet`
      : `<b>${VNAME[co]}</b> · ${brands.length} marcas no roadmap · nenhuma medida ainda`;
  } else {
    const {pts, cum} = curve(scope);
    document.getElementById('gn-chart').innerHTML = mountainSVG(cum, pts, goal, label, lang);

    const pool = isCo ? DATA.filter(t=>mine.some(s=>s.k===t.store)) : DATA.filter(t=>t.store===scope);
    const wins = pool.filter(t=>t.cls==='winner'), ctrls = pool.filter(t=>t.cls==='control');
    const incr  = somaCur(wins);
    const saved = somaCur(ctrls, t => t.incr < 0 ? -t.incr : 0);
    const done = pool.filter(t=>t.status==='Done').length;
    const kpis = lang==='en' ? [
      ['Accumulated gain', pct(cum), `${Math.round(cum/goal*100)}% of goal`, 'pos'],
      ['Winners', `${wins.length}`, `${done?Math.round(wins.length/done*100):0}% of finished`, ''],
      ['Measured increment', fmtCur(incr),
        incr.length>1 ? 'on the winners, by currency' : 'summed on the winners',
        incr.length>1 ? 'moedas' : 'pos'],
      ['Loss avoided', fmtCur(saved, {assinado:false}),
        `${ctrls.length} tests blocked by control`, saved.length>1 ? 'moedas' : ''],
      ['Tests run', `${pool.length}`, `${done} done`, ''],
    ] : [
      ['Ganho acumulado', pct(cum), `${Math.round(cum/goal*100)}% da meta`, 'pos'],
      ['Vencedores', `${wins.length}`, `${done?Math.round(wins.length/done*100):0}% dos finalizados`, ''],
      ['Incremento medido', fmtCur(incr),
        incr.length>1 ? 'nos vencedores, por moeda' : 'somado nos vencedores',
        incr.length>1 ? 'moedas' : 'pos'],
      ['Perda evitada', fmtCur(saved, {assinado:false}),
        `${ctrls.length} testes barrados`, saved.length>1 ? 'moedas' : ''],
      ['Testes rodados', `${pool.length}`, `${done} finalizados`, ''],
    ];
    document.getElementById('gn-kpis').innerHTML = kpis
      .map(([h,v,n,c])=>`<div class="kpi"><h4>${h}</h4><div class="v num ${c}">${v}</div><div class="n">${n}</div></div>`).join('');

    const rows = mine.map(s=>({...s, cum:cumOf(s.k), w:winnersOf(s.k).length}))
      .sort((a,b)=>b.cum-a.cum);
    const max = Math.max(...rows.map(r=>r.cum), goal*0.6);
    document.getElementById('gn-rank').innerHTML = `<h4>${byStoreLb}</h4>` + rows.map(r=>
      `<button class="rrow" data-gstore="${r.k}" aria-current="${scope===r.k}">
        <span class="rname">${r.n}</span>
        <span class="rbar"><i style="width:${Math.max(2, r.cum/max*100)}%"></i></span>
        <span class="rval"><b>${pct(r.cum)}</b><span>${lang==='en' ? `${r.w} winner${r.w===1?'':'s'}` : `${r.w} vencedor${r.w===1?'':'es'}`}</span></span>
      </button>`).join('');

    document.getElementById('gn-stats').innerHTML = lang==='en'
      ? (isCo
        ? `<b>${VNAME[co]}</b> · ${mine.length} stores · <b>${wins.length}</b> ${wins.length===1?'compounded winner':'compounded winners'} · weighted average by ${baseDoPesoEN(mine)}`
        : `<b>${label}</b> · <b>${pts.length}</b> ${pts.length===1?'compounded winner':'compounded winners'} in chronological order`)
      : (isCo
        ? `<b>${VNAME[co]}</b> · ${mine.length} lojas · <b>${wins.length}</b> ${wins.length===1?'vencedor composto':'vencedores compostos'} · média ponderada por ${baseDoPeso(mine)}`
        : `<b>${label}</b> · <b>${pts.length}</b> ${pts.length===1?'vencedor composto':'vencedores compostos'} em ordem cronológica`);
  }
  document.getElementById('gn-foot').innerHTML = lang==='en' ? `<span class="lb">Method</span>
    Accumulated gain compounds the RPV lifts of tests with a <b>confirmed winner</b> (≥95%), in the order
    they closed: <b>(1+l₁)×(1+l₂)…−1</b>. This assumes every winner was rolled out to 100% and effects
    don't overlap — in practice they do, so read it as a <b>ceiling on the gain</b>, not guaranteed
    revenue. Inconclusive tests and ones where control won don't count. The company view is the
    <b>weighted average by ${baseDoPesoEN(mine)}</b> of each store in the tests, recalculated at every winner${
      umaMoeda(mine) ? '' : ' — stores in this vertical bill in different currencies, so the weight ' +
      'is by visitors, not revenue'}.
    Money values <b>aren't converted</b>: each store shows in its own currency and totals are broken
    out by currency.
    The goal is a reference marker you pick from the selector — it isn't an official target.` : `<span class="lb">Método</span>
    O ganho acumulado compõe os lifts de RPV dos testes com <b>vencedor confirmado</b> (≥95%), em ordem de
    encerramento: <b>(1+l₁)×(1+l₂)…−1</b>. Isso assume que todo vencedor foi escalado a 100% e que os efeitos
    são independentes — na prática eles se sobrepõem, então leia como <b>teto do ganho</b>, não como receita
    garantida. Testes inconclusivos e os que o controle venceu não somam. A visão de empresa é a
    <b>média ponderada por ${baseDoPeso(mine)}</b> de cada loja nos testes, recalculada a cada vencedor${
      umaMoeda(mine) ? '' : ' — as lojas desta vertical faturam em moedas diferentes, então o peso ' +
      'é por visitantes, e não por receita'}.
    Valores em dinheiro <b>não são convertidos</b>: cada loja aparece na sua moeda e os totais são
    quebrados por moeda.
    A meta é um marcador de referência que você escolhe no seletor — não é um alvo oficial.`;
}

renderMatrix(); renderTests(); renderRoadmap(); renderGanho();
</script>
