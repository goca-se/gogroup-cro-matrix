name: Atualizar matriz CRO

on:
  schedule:
    - cron: '0 11 * * 1-5'   # 08:00 em Fortaleza (UTC-3), dias úteis
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'scripts/**', '.github/workflows/**']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: matriz-cro
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Puxar resultados do Elevate
        env:
          ELEVATE_APICE:    ${{ secrets.ELEVATE_APICE }}
          ELEVATE_BARBOURS: ${{ secrets.ELEVATE_BARBOURS }}
          ELEVATE_KOKESHI:  ${{ secrets.ELEVATE_KOKESHI }}
          ELEVATE_RITUARIA: ${{ secrets.ELEVATE_RITUARIA }}
          ELEVATE_LESCENT:  ${{ secrets.ELEVATE_LESCENT }}
          ELEVATE_POTTD:    ${{ secrets.ELEVATE_POTTD }}
          ELEVATE_WAK:      ${{ secrets.ELEVATE_WAK }}
          ELEVATE_FUNEM:    ${{ secrets.ELEVATE_FUNEM }}
          ELEVATE_LOC:      ${{ secrets.ELEVATE_LOC }}
          ELEVATE_STICHES:  ${{ secrets.ELEVATE_STICHES }}
        run: npm run fetch:elevate

      - name: Puxar roadmap do Jira
        env:
          JIRA_HOST:      ${{ vars.JIRA_HOST }}
          JIRA_EMAIL:     ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: npm run fetch:jira

      - name: Gerar a página
        run: npm run build

      - name: Guardar o snapshot de dados
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # `data/` é gerado, então nunca há o que mesclar: reancoramos no topo do
          # remoto e recomitamos por cima. Sem isso, um push concorrente derruba o run.
          for tentativa in 1 2 3; do
            git fetch -q origin main
            git reset -q --soft origin/main
            git add data/
            if git diff --staged --quiet; then echo "sem mudança nos dados"; exit 0; fi
            git commit -qm "dados: snapshot de $(date -u +%Y-%m-%d\ %H:%M) UTC"
            git push -q origin HEAD:main && exit 0
            echo "push recusado (tentativa $tentativa), reancorando…"
            sleep $((tentativa * 5))
          done
          echo "::error::não consegui gravar o snapshot depois de 3 tentativas"
          exit 1

      - uses: actions/upload-artifact@v7
        with:
          name: matriz-cro
          path: dist/index.html
          retention-days: 30

      - name: Preparar para o GitHub Pages
        if: vars.ENABLE_PAGES == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  publicar:
    needs: refresh
    if: vars.ENABLE_PAGES == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
